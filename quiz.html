<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Care Quiz - Exotic Pets Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/styles.css" />

</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="/images/logo.png" alt="Critter Kingdom" class="logo-img" />
      <span class="logo-text">Critter Kingdom</span>
    </div>
    <nav class="nav-links">
      <a href="/">Products</a>
      <a href="/care-guide">Care Guide</a>
      <a href="/cart">Cart (<span id="cart-count">0</span>)</a>
      <a href="/orders" class="nav-signed-in">Orders</a>
      <a href="/payment-methods" class="nav-signed-in">Payment Methods</a>
      <a href="/my-account">Account</a>
      <a href="/login" class="nav-login-btn" id="nav-auth-link">Login</a>
    </nav>
  </header>

  <main class="main">
    <div class="quiz-wrapper">
      <div class="quiz-box" id="quiz-box">
        <div id="state-intro" class="quiz-state"></div>
        <div id="state-question" class="quiz-state"></div>
        <div id="state-result" class="quiz-state"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Exotic Pets Store. IT340</p>
  </footer>


  <script src="/script.js" defer></script>
  <script src="/quiz.js" defer></script>
</body>
</html>
